; Volumetric G-force meter firmware: 8 stacked transparent OLEDs on an ESP32.
;
;   pio run -e esp32dev -t upload        classic ESP32-WROOM, 128x56 transparent panels (default)
;   pio run -e esp32-s3 -t upload        ESP32-S3 DevKitC
;   pio run -e esp32dev-128x64 -t upload generic 128x64 SSD1309 panels
;   pio device monitor                   serial CLI at 115200 (type `help`)
;
; The hardware-agnostic core lives in lib/gmeter_core and is shared with the
; host simulator (host/CMakeLists.txt).

[platformio]
default_envs = esp32dev
description = Volumetric G-force meter on eight stacked transparent OLEDs

[common]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -Wall
  ; The ESP32 FPU is single precision only; promote-to-double is a silent 10x slowdown.
  -Wdouble-promotion
  -fno-math-errno
  -DGM_PANEL_W=128
  -DGM_LAYERS=8
  ; Panel spacing expressed in pixel pitches (0.274 mm/px). 16 px ~= 4.4 mm between glass centres.
  -DGM_LAYER_PITCH_PX=16.0f
  ; Smoke grid sized for the ESP32 budget: 16x8 cells per layer, ~58 KB while active.
  -DGM_SMOKE_NX=16
  -DGM_SMOKE_NY=8
  ; SSD1309 spec maximum is 10 MHz. Drop to 8000000 if long wiring glitches.
  -DGM_SPI_HZ=10000000
  -DGM_TARGET_FPS=60
; Transparent panels from SparkFun (LCD-15173), Crystalfontz (CFAL12856A0-0151-B), Waveshare 1.51"
; and DFRobot (DFR0934) are all WiseChip UG-2856KLBAG01 glass: 128x56, SSD1309, external 12 V VCC.
transparent_flags =
  -DGM_PANEL_H=56
  -DGM_PANEL_MODEL=0
generic_1309_flags =
  -DGM_PANEL_H=64
  -DGM_PANEL_MODEL=1

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = ${common.build_unflags}
lib_ldf_mode = deep

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = ${common.build_flags} ${common.transparent_flags} -DGM_BOARD_ESP32_CLASSIC=1

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = ${common.build_flags} ${common.transparent_flags} -DGM_BOARD_ESP32_S3=1

[env:esp32dev-128x64]
platform = espressif32
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = ${common.build_flags} ${common.generic_1309_flags} -DGM_BOARD_ESP32_CLASSIC=1
